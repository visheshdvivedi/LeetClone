services:

  nginx:
      image: jonasal/nginx-certbot:latest
      restart: unless-stopped
      environment:
        - CERTBOT_EMAIL
      env_file:
        - ./nginx-certbot.env
      ports:
        - 80:80
        - 443:443
      volumes:                                    
        - nginx_secrets:/etc/letsencrypt          
        - ./user_conf.d:/etc/nginx/user_conf.d

  backend:
    build:
      context: ./backend
    container_name: backend
    environment:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_BACKEND_REDIRECT_URL: ${GOOGLE_OAUTH_BACKEND_REDIRECT_URL}
      GOOGLE_OAUTH_FRONTEND_REDIRECT_URL: ${GOOGLE_OAUTH_FRONTEND_REDIRECT_URL}
      JUDGE_URL: ${JUDGE_URL}
      PGDATABASE: leetclonedb
      PGHOST: postgres
      PGPASSWORD: Password@123!
      PGPORT: 5432
      PGUSER: postgresadmin
    ports:
      - "8000:8000"
    volumes:
      - "./backend:/usr/src/app"

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: Password@123!
      POSTGRES_USER: postgresadmin
      POSTGRES_DB: leetclonedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "leetclonedb"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

volumes:
  postgres_data: